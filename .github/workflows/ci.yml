name: CI (build)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${BEFORE_SHA}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 "${GITHUB_SHA}")"
          fi
          git diff --name-only --diff-filter=ACMR "${base_sha}" "${GITHUB_SHA}" -- '*.c' '*.cpp' '*.h' '*.hpp' \
            | awk '!/^(lib\/EpdFont\/builtinFonts\/|lib\/Epub\/Epub\/hyphenation\/generated\/|lib\/uzlib\/|lib\/miniz\/third_party\/)/' \
            | xargs -r /usr/lib/llvm-21/bin/clang-format -style=file -i
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-core620-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-core620-${{ runner.os }}-

      # check_skip_packages keeps packages out of the analysis, but pio check
      # still runs the toolchain compiler to read its defines. Install the
      # platform's toolchain first: a platform bump otherwise leaves only the
      # previous toolchain in the restored cache and the check exits with 127.
      - name: Install PlatformIO packages
        run: |
          pio pkg install -e default
          python scripts/patch_pio_scons.py "$HOME/.platformio/platforms/espressif32/platform.json"

      # Match PlatformIO's 2.11 baseline, but build a native executable instead
      # of depending on the bundled binary's runtime loader on ubuntu-latest.
      - name: Check out cppcheck 2.11
        uses: actions/checkout@v6
        with:
          repository: cppcheck-opensource/cppcheck
          ref: f156b1ecb20af834d6d70a20b9485533e2b5bdaf
          path: build/cppcheck-source
          persist-credentials: false

      - name: Build native cppcheck
        run: |
          make -C build/cppcheck-source -j2 MATCHCOMPILER=yes
          build/cppcheck-source/cppcheck --version

      # The checked-in adapter installs the exact native tool via the
      # environment's platform_packages; no cached global package is required.
      - name: Run cppcheck
        run: |
          python -m unittest discover -s scripts -p test_check_firmware.py
          python scripts/check_firmware.py --cppcheck build/cppcheck-source/cppcheck

  build:
    strategy:
      fail-fast: false
      matrix:
        environment: [default, gh_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-core620-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-core620-${{ runner.os }}-

      - name: Align installed SCons metadata
        run: |
          pio pkg install -e "${{ matrix.environment }}"
          python scripts/patch_pio_scons.py "$HOME/.platformio/platforms/espressif32/platform.json"

      - name: Build Pocket Daily Firmware
        run: |
          set -euo pipefail
          ./scripts/pio.sh run -e "${{ matrix.environment }}" | tee pio.log

      - name: Extract firmware stats

        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          {
            echo "## Firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.environment }}.bin
          path: .pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Check integration boundaries and sync safety
        run: |
          python3 scripts/check_seam.py
          python3 -m unittest discover -s scripts -p test_check_seam.py
          python3 -m unittest discover -s scripts -p test_sync_upstream.py
          python3 -m unittest discover -s scripts -p test_patch_storage_sdk.py
          python3 -m unittest discover -s scripts -p test_patch_pio_scons.py
          python3 -m unittest discover -s scripts -p test_sync_routes.py
          python3 -m unittest discover -s scripts -p test_build_host_apple.py

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
