name: Compile Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build Pocket Daily Firmware
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Pocket-Daily-Firmware-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            LICENSE
            licenses/NimBLE-Arduino-LICENSE.txt
            licenses/NimBLE-Arduino-NOTICE.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            .pio/build/gh_release/bootloader.bin \
            .pio/build/gh_release/firmware.bin \
            .pio/build/gh_release/firmware.elf \
            .pio/build/gh_release/firmware.map \
            .pio/build/gh_release/partitions.bin \
            LICENSE \
            licenses/NimBLE-Arduino-LICENSE.txt \
            licenses/NimBLE-Arduino-NOTICE.txt \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "Pocket Daily Firmware ${GITHUB_REF_NAME}"
